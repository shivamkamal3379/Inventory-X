# Serves the built SPA and proxies /api to the backend container.
#
# Fronting both on one origin means the browser never makes a cross-origin call,
# so no CORS preflight and no third-party-cookie issues.

upstream inventoryx_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requests larger than this are rejected before reaching the app.
    client_max_body_size 2m;

    # Do not advertise the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # NOTE ON add_header INHERITANCE
    # nginx does not merge add_header across levels: if a `location` declares
    # any add_header of its own, it inherits NONE from the server block. The
    # security headers below are therefore repeated in every location that sets
    # its own headers. Declaring them only here silently dropped them from the
    # SPA response, because `try_files ... /index.html` re-enters location
    # matching and lands in `location = /index.html`, which sets Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Container-level liveness check; not part of the app.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The trailing slash on proxy_pass strips the /api prefix, so the backend
    # keeps its clean route paths. FastAPI's root_path=/api makes the generated
    # OpenAPI URLs match what the browser actually calls.
    location /api/ {
        proxy_pass http://inventoryx_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: a client-supplied value must never be
        # trusted, since the API rate-limits on this header.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        # `expires` would emit a second, conflicting Cache-Control header, so the
        # value is set explicitly instead.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading a stale bundle
    # that references asset hashes which no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # SPA fallback: client-side routes like /dashboard/inventory are not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
