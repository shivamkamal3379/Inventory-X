[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "RUF012",  # ClassVar annotations are noise on Pydantic/SQLAlchemy models
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literals and shadow fixtures by design.
"tests/*" = ["S101", "B011"]
# The module docstring explains why these imports look unused.
"src/models/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
